<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🚗 Vehicle Insurance Prediction</h1>
        <p class="subtitle">Get AI-powered insurance recommendations for your vehicle</p>

        <form method="post" action="/" id="predictionForm">
            <div class="form-group">
                <label for="Gender">
                    Gender 
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">1 for Male, 0 for Female</span>
                    </div>
                </label>
                <input type="number" id="Gender" name="Gender" min="0" max="1" required placeholder="0 or 1">
            </div>

            <div class="form-group">
                <label for="Age">Age</label>
                <input type="number" id="Age" name="Age" required placeholder="e.g., 25" min="18" max="100">
            </div>

            <div class="form-group">
                <label for="Driving_License">
                    Driving License
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">0 for No, 1 for Yes</span>
                    </div>
                </label>
                <input type="number" id="Driving_License" name="Driving_License" min="0" max="1" required placeholder="0 or 1">
            </div>

            <div class="form-group">
                <label for="Region_Code">Region Code</label>
                <input type="number" step="0.01" id="Region_Code" name="Region_Code" required placeholder="e.g., 28.5">
            </div>

            <div class="form-group">
                <label for="Previously_Insured">
                    Previously Insured
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">0 for No, 1 for Yes</span>
                    </div>
                </label>
                <input type="number" id="Previously_Insured" name="Previously_Insured" min="0" max="1" required placeholder="0 or 1">
            </div>

            <div class="form-group">
                <label for="Annual_Premium">Annual Premium (₹)</label>
                <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" required placeholder="e.g., 25000">
            </div>

            <div class="form-group">
                <label for="Policy_Sales_Channel">Policy Sales Channel</label>
                <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" required placeholder="e.g., 152.0">
            </div>

            <div class="form-group">
                <label for="Vintage">Vintage (Days)</label>
                <input type="number" id="Vintage" name="Vintage" required placeholder="e.g., 85" min="0">
            </div>

            <div class="form-group">
                <label for="Vehicle_Age_lt_1_Year">
                    Vehicle Age < 1 Year
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">0 for No, 1 for Yes</span>
                    </div>
                </label>
                <input type="number" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" min="0" max="1" required placeholder="0 or 1">
            </div>

            <div class="form-group">
                <label for="Vehicle_Age_gt_2_Years">
                    Vehicle Age > 2 Years
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">0 for No, 1 for Yes</span>
                    </div>
                </label>
                <input type="number" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" min="0" max="1" required placeholder="0 or 1">
            </div>

            <div class="form-group">
                <label for="Vehicle_Damage_Yes">
                    Vehicle Damage
                    <div class="tooltip">
                        <span class="info-icon">?</span>
                        <span class="tooltiptext">0 for No, 1 for Yes</span>
                    </div>
                </label>
                <input type="number" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" min="0" max="1" required placeholder="0 or 1">
            </div>
        </form>

        <div class="button-group">
            <button type="submit" form="predictionForm" class="predict-button" onclick="showLoading()">
                🔮 Get Prediction
            </button>
            
            <form method="get" action="/train" style="display: inline;">
                <button type="submit" class="train-button">
                    🧠 Train Model
                </button>
            </form>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your prediction...</p>
        </div>

        {% if context %}
            <div class="result">
                <h2>🎯 Prediction Result</h2>
                <p>{{ context }}</p>
            </div>
        {% endif %}
    </div>

    <script>
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // Add form validation
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            const inputs = this.querySelectorAll('input[required]');
            let isValid = true;
            
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    isValid = false;
                    input.style.borderColor = '#e74c3c';
                } else {
                    input.style.borderColor = '#e1e5e9';
                }
            });
            
            if (!isValid) {
                e.preventDefault();
                alert('Please fill in all required fields.');
                document.getElementById('loading').style.display = 'none';
            }
        });

        // Add input animations
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
